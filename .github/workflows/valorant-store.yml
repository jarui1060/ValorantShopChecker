name: Valorant Store Check
run-name: Boutique VALORANT · Europe

on:
  schedule:
    # 01:17 in Belgium in winter, 02:17 in summer. Runs can start late.
    - cron: "17 0 * * *"
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - ".github/workflows/valorant-store.yml"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: valorant-store
  cancel-in-progress: false

jobs:
  check-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline checks
        run: python -m unittest discover -s tests -v

      - name: Restore encrypted Riot session
        uses: actions/cache/restore@v4
        with:
          path: .state/riot-session.enc
          key: riot-session-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: riot-session-v1-

      - name: Fetch EU store and notify Discord
        working-directory: scripts
        env:
          RIOT_COOKIES: ${{ secrets.RIOT_COOKIES }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REGION: eu
        run: python ci_check_store.py

      - name: Save encrypted refreshed session
        if: always() && hashFiles('.state/riot-session.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: .state/riot-session.enc
          key: riot-session-v1-${{ github.run_id }}-${{ github.run_attempt }}
